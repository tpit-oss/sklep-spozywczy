<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kasa Samoobsługowa</title>
<style>
  :root {
    --bg-color: #d8d8d8;
    --panel-bg: #ffffff;
    --border-color: #bcbcbc;
    --green-btn: #009900;
    --text-color: #000000;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    font-family: Arial, sans-serif;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: var(--bg-color);
  }

  /* Główny kontener aplikacji */
  .kiosk-container {
    display: flex;
    width: 100%;
    height: 100%;
    gap: 8px;
    padding: 8px;
    background-color: #e2e2e2;
  }

  /* Ukryte pole dla skanera */
  #barcode-input {
    position: absolute;
    top: -9999px;
    left: -9999px;
    opacity: 0;
  }

  /* LEWY PANEL (Ostatni produkt + sterowanie) */
  .left-panel {
    flex: 2;
    display: flex;
    flex-direction: column;
    background-color: var(--panel-bg);
    border: 1px solid var(--border-color);
  }

  /* Duża sekcja z ostatnio zeskanowanym produktem */
  .last-product-display {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }

  .last-product-title {
    font-size: 24px;
    font-weight: bold;
    color: var(--text-color);
    line-height: 1.2;
    max-width: 80%;
  }

  .last-product-price {
    font-size: 42px;
    font-weight: bold;
    color: var(--text-color);
    text-align: right;
    align-self: flex-end;
  }

  /* Dolny pasek akcji w lewym panelu */
  .left-bottom-bar {
    border-top: 1px solid var(--border-color);
  }

  .status-and-help {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 15px;
    font-size: 14px;
    font-weight: bold;
    border-bottom: 1px solid var(--border-color);
  }

  .btn-help {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--green-btn);
    cursor: pointer;
    border: none;
    background: transparent;
    font-size: 14px;
    font-weight: bold;
  }

  .btn-help-icon {
    width: 16px;
    height: 16px;
    background-color: var(--green-btn);
    border-radius: 50%;
    display: inline-block;
  }

  .btn-search {
    width: 100%;
    background-color: var(--green-btn);
    color: white;
    border: none;
    padding: 14px 15px;
    font-size: 16px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }

  .btn-search-icon {
    font-size: 20px;
  }

  /* PRAWY PANEL (Lista paragonu + zapłata) */
  .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background-color: var(--panel-bg);
    border: 1px solid var(--border-color);
  }

  .receipt-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 15px;
  }

  .receipt-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-color);
    font-size: 13px;
    font-weight: bold;
  }

  .receipt-row .name {
    max-width: 70%;
    line-height: 1.2;
  }

  .receipt-row .price {
    white-space: nowrap;
  }

  .btn-pay {
    width: 100%;
    background-color: var(--green-btn);
    color: white;
    border: none;
    padding: 14px 15px;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    margin-top: auto;
  }

  .btn-pay-arrows {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: -3px;
  }

  /* MODAL / OVERLAY - "Poczekaj na pomoc" */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  .overlay.show {
    display: flex;
  }

  .help-dialog {
    background: #ffffff;
    width: 480px;
    padding: 50px 30px;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .help-dialog-exclamation {
    color: #ff0000;
    font-size: 80px;
    font-weight: bold;
    line-height: 1;
  }

  .help-dialog-text {
    color: #ff0000;
    font-size: 32px;
    font-weight: bold;
    line-height: 1.1;
  }

  .help-dialog-lock {
    position: absolute;
    bottom: 15px;
    right: 20px;
    width: 28px;
    height: 28px;
    background: #ff0000;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body onclick="initAudioAndFocus()">

<input type="text" id="barcode-input" autocomplete="off">

<div class="kiosk-container">
  <!-- LEWA STRONA -->
  <div class="left-panel">
    <div class="last-product-display">
      <div class="last-product-title" id="last-title">Nazwa produktu który został zeskanowany</div>
      <div class="last-product-price" id="last-price">CENA</div>
    </div>

    <div class="left-bottom-bar">
      <div class="status-and-help">
        <span id="scan-status-text">Zeskanuj artykuł</span>
        <button class="btn-help" onclick="toggleHelpModal(true)">
          Wezwij pomoc
          <span class="btn-help-icon"></span>
        </button>
      </div>
      <button class="btn-search" onclick="ensureFocus()">
        <span>Wyszukaj artykuł lub wprowadź kod</span>
        <span class="btn-search-icon">🛒</span>
      </button>
    </div>
  </div>

  <!-- PRAWA STRONA -->
  <div class="right-panel">
    <div class="receipt-list" id="receipt-list">
      <div class="receipt-row">
        <span class="name">Nazwa produktu który został zeskanowany</span>
        <span class="price">CENA</span>
      </div>
      <div class="receipt-row">
        <span class="name">Nazwa produktu który został zeskanowany</span>
        <span class="price">CENA</span>
      </div>
    </div>

    <button class="btn-pay" onclick="handlePay()">
      <span>Zapłać</span>
      <span class="btn-pay-arrows">&gt;&gt;&gt;</span>
    </button>
  </div>
</div>

<!-- MODAL - POCZEKAJ NA POMOC -->
<div class="overlay" id="help-overlay">
  <div class="help-dialog">
    <div class="help-dialog-exclamation">!</div>
    <div class="help-dialog-text">Poczekaj na pomoc</div>
    <div class="help-dialog-lock" onclick="toggleHelpModal(false)">🔒</div>
  </div>
</div>

<script>
  let audioCtx = null;
  let cart = [];

  function initAudioAndFocus() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    ensureFocus();
  }

  function ensureFocus() {
    const overlay = document.getElementById('help-overlay');
    if (!overlay.classList.contains('show')) {
      const input = document.getElementById('barcode-input');
      if (input && document.activeElement !== input) {
        input.focus();
      }
    }
  }

  setInterval(ensureFocus, 300);

  function toggleHelpModal(show) {
    const overlay = document.getElementById('help-overlay');
    if (show) {
      overlay.classList.add('show');
    } else {
      overlay.classList.remove('show');
      ensureFocus();
    }
  }

  function handlePay() {
    alert("Przejście do płatności");
  }

  // Obsługa skanowania / wpisywania kodów
  const barcodeInput = document.getElementById('barcode-input');
  barcodeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const code = barcodeInput.value.trim();
      barcodeInput.value = '';
      if (code) {
        addItem(code);
      }
    }
  });

  function addItem(code) {
    const name = "Produkt " + code;
    const price = (Math.random() * 20 + 1).toFixed(2) + " zł";

    // Aktualizacja lewego panelu (ostatnio zeskanowany)
    document.getElementById('last-title').textContent = name;
    document.getElementById('last-price').textContent = price;

    // Dodanie do paragonu po prawej stronie
    cart.push({ name, price });
    renderReceipt();
  }

  function renderReceipt() {
    const container = document.getElementById('receipt-list');
    container.innerHTML = cart.map(item => `
      <div class="receipt-row">
        <span class="name">${item.name}</span>
        <span class="price">${item.price}</span>
      </div>
    `).join('');
    container.scrollTop = container.scrollHeight;
  }
</script>
</body>
</html>
