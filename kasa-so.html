<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Kasa samoobsługowa</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #eeeeee;
            color: #222;
        }

        button,
        input {
            font-family: inherit;
        }

        .kasa {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #eeeeee;
        }

        /* TOP */

        .topbar {
            height: 62px;
            background: #ffffff;
            border-bottom: 1px solid #d6d6d6;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            flex-shrink: 0;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
        }

        .brand span {
            color: #16823c;
        }

        .status {
            background: #16823c;
            color: white;
            padding: 7px 13px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 700;
        }

        /* MAIN */

        .main {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        /* LEFT */

        .left {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #f5f5f5;
        }

        .search-area {
            background: white;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .search {
            width: 100%;
            height: 47px;
            border: 1px solid #cfcfcf;
            border-radius: 3px;
            background: #fafafa;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
        }

        .search:focus {
            border-color: #16823c;
            background: white;
        }

        .products {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(120px, 1fr));
            gap: 8px;
        }

        .product {
            background: white;
            border: 1px solid #d7d7d7;
            border-radius: 3px;
            min-height: 125px;
            padding: 13px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            transition: 0.1s;
        }

        .product:active {
            transform: scale(.98);
            background: #f0f0f0;
        }

        .product-name {
            font-size: 15px;
            line-height: 1.25;
        }

        .product-category {
            color: #888;
            font-size: 12px;
            margin-top: 6px;
        }

        .product-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
        }

        .product-price {
            font-size: 17px;
            font-weight: 700;
        }

        .plus {
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 3px;
            background: #16823c;
            color: white;
            font-size: 22px;
        }

        /* RIGHT */

        .right {
            width: 390px;
            background: white;
            border-left: 1px solid #d2d2d2;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .cart-header {
            height: 54px;
            border-bottom: 1px solid #ddd;
            padding: 0 17px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
        }

        .cart-count {
            color: #777;
            font-size: 13px;
            font-weight: 400;
        }

        .cart {
            flex: 1;
            overflow-y: auto;
        }

        .empty {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            text-align: center;
            padding: 30px;
            line-height: 1.5;
        }

        .cart-item {
            padding: 13px 15px;
            border-bottom: 1px solid #eeeeee;
        }

        .cart-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .cart-name {
            font-size: 14px;
        }

        .cart-price {
            font-weight: 700;
            white-space: nowrap;
        }

        .cart-controls {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }

        .quantity-button {
            width: 34px;
            height: 32px;
            border: 1px solid #ccc;
            background: #f5f5f5;
            border-radius: 3px;
            font-size: 18px;
            cursor: pointer;
        }

        .quantity {
            width: 38px;
            text-align: center;
            font-weight: 700;
        }

        .remove {
            margin-left: auto;
            border: 0;
            background: transparent;
            color: #b00020;
            cursor: pointer;
            font-size: 13px;
        }

        /* SUMMARY */

        .summary {
            border-top: 1px solid #ddd;
            padding: 14px 15px;
            background: #fafafa;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .total-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #ddd;
        }

        .total-label {
            font-size: 18px;
            font-weight: 700;
        }

        .total {
            font-size: 29px;
            font-weight: 700;
            color: #16823c;
        }

        .pay {
            width: 100%;
            height: 58px;
            border: 0;
            border-radius: 3px;
            margin-top: 12px;
            background: #16823c;
            color: white;
            font-size: 19px;
            font-weight: 700;
            cursor: pointer;
        }

        .pay:active {
            background: #116b31;
        }

        .pay:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }

        /* BOTTOM BAR */

        .bottom {
            height: 68px;
            background: white;
            border-top: 1px solid #d2d2d2;
            display: flex;
            gap: 7px;
            padding: 8px;
            flex-shrink: 0;
        }

        .bottom button {
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 3px;
            padding: 0 18px;
            font-size: 14px;
            cursor: pointer;
        }

        .bottom button:active {
            background: #eee;
        }

        .back {
            margin-left: auto;
        }

        /* PAYMENT */

        .payment-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .payment-window {
            width: min(500px, calc(100% - 30px));
            background: white;
            border-radius: 6px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,.25);
        }

        .payment-window h2 {
            margin-top: 0;
        }

        .payment-total {
            font-size: 35px;
            font-weight: 700;
            color: #16823c;
            margin: 20px 0;
        }

        .payment-method {
            width: 100%;
            height: 52px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 4px;
            margin-top: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .cancel {
            margin-top: 15px;
            border: 0;
            background: transparent;
            color: #555;
            padding: 10px;
            cursor: pointer;
        }

        /* TABLET */

        @media(max-width: 1000px) {

            .right {
                width: 340px;
            }

            .product-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media(max-width: 750px) {

            html,
            body {
                overflow: auto;
            }

            .kasa {
                min-height: 100vh;
                height: auto;
            }

            .main {
                flex-direction: column;
            }

            .left {
                min-height: 55vh;
            }

            .right {
                width: 100%;
                min-height: 45vh;
                border-left: 0;
                border-top: 1px solid #ccc;
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .bottom {
                overflow-x: auto;
            }

            .bottom button {
                white-space: nowrap;
            }
        }

    </style>
</head>

<body>

<div class="kasa">

    <header class="topbar">

        <div class="brand">
            Kasa <span>samoobsługowa</span>
        </div>

        <div class="status">
            KASA GOTOWA
        </div>

    </header>

    <main class="main">

        <section class="left">

            <div class="search-area">

                <input
                    id="search"
                    class="search"
                    type="text"
                    placeholder="Wyszukaj produkt lub zeskanuj kod kreskowy..."
                    autocomplete="off"
                >

            </div>

            <div class="products">

                <div
                    id="productGrid"
                    class="product-grid"
                ></div>

            </div>

            <div class="bottom">

                <button onclick="clearCart()">
                    Wyczyść koszyk
                </button>

                <button onclick="showHelp()">
                    Pomoc
                </button>

                <button onclick="scanMode()">
                    Skanuj kod
                </button>

                <button
                    class="back"
                    onclick="location.href='index.html'"
                >
                    Panel
                </button>

            </div>

        </section>

        <aside class="right">

            <div class="cart-header">

                <span>
                    Twoje zakupy
                </span>

                <span
                    class="cart-count"
                    id="cartCount"
                >
                    0 produktów
                </span>

            </div>

            <div
                id="cart"
                class="cart"
            ></div>

            <div class="summary">

                <div class="summary-line">
                    <span>Liczba produktów</span>
                    <span id="itemsCount">0</span>
                </div>

                <div class="total-line">

                    <span class="total-label">
                        Do zapłaty
                    </span>

                    <span
                        class="total"
                        id="total"
                    >
                        0,00 zł
                    </span>

                </div>

                <button
                    id="payButton"
                    class="pay"
                    onclick="openPayment()"
                    disabled
                >
                    PRZEJDŹ DO PŁATNOŚCI
                </button>

            </div>

        </aside>

    </main>

</div>


<div
    id="paymentOverlay"
    class="payment-overlay"
>

    <div class="payment-window">

        <h2>
            Wybierz sposób płatności
        </h2>

        <div
            class="payment-total"
            id="paymentTotal"
        >
            0,00 zł
        </div>

        <button
            class="payment-method"
            onclick="finishPayment('Karta')"
        >
            💳 Płatność kartą
        </button>

        <button
            class="payment-method"
            onclick="finishPayment('Gotówka')"
        >
            💵 Płatność gotówką
        </button>

        <button
            class="payment-method"
            onclick="finishPayment('BLIK')"
        >
            📱 BLIK
        </button>

        <button
            class="cancel"
            onclick="closePayment()"
        >
            Anuluj
        </button>

    </div>

</div>


<script>

let db = null;
let products = [];
let cart = [];


/* DATABASE */

async function initDatabase() {

    const SQL = await initSqlJs({

        locateFile: file =>
            `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/${file}`

    });

    const saved = localStorage.getItem("kasaDB");

    if (saved) {

        const bytes = Uint8Array.from(
            atob(saved),
            c => c.charCodeAt(0)
        );

        db = new SQL.Database(bytes);

    } else {

        const response = await fetch("baza.sql");
        const sql = await response.text();

        db = new SQL.Database();
        db.run(sql);

        saveDatabase();

    }

    loadProducts();
}


/* PRODUCTS */

function loadProducts() {

    const result = db.exec(`
        SELECT
            p.id,
            p.nazwa,
            p.cena,
            p.kod_kreskowy,
            k.nazwa
        FROM produkty p
        JOIN kategorie k
            ON k.id = p.kategoria_id
        ORDER BY p.id
    `);

    products = [];

    if (!result.length) return;

    result[0].values.forEach(row => {

        products.push({

            id: row[0],
            name: row[1],
            price: Number(row[2]),
            barcode: row[3],
            category: row[4]

        });

    });

    renderProducts(products);
}


/* PRODUCT GRID */

function renderProducts(list) {

    const grid =
        document.getElementById("productGrid");

    grid.innerHTML = "";

    list.forEach(product => {

        const element =
            document.createElement("div");

        element.className = "product";

        element.onclick = () =>
            addToCart(product.id);

        element.innerHTML = `

            <div>

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="product-category">
                    ${product.category}
                </div>

            </div>

            <div class="product-bottom">

                <div class="product-price">
                    ${formatPrice(product.price)}
                </div>

                <button class="plus">
                    +
                </button>

            </div>
        `;

        grid.appendChild(element);

    });
}


/* CART */

function addToCart(id) {

    const product =
        products.find(p => p.id === id);

    if (!product) return;

    const existing =
        cart.find(item => item.id === id);

    if (existing) {

        existing.quantity++;

    } else {

        cart.push({

            ...product,
            quantity: 1

        });

    }

    renderCart();
}


function changeQuantity(id, amount) {

    const item =
        cart.find(item => item.id === id);

    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {

        cart =
            cart.filter(item => item.id !== id);

    }

    renderCart();
}


function removeFromCart(id) {

    cart =
        cart.filter(item => item.id !== id);

    renderCart();
}


function renderCart() {

    const container =
        document.getElementById("cart");

    container.innerHTML = "";

    if (cart.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <div>
                    <strong>Koszyk jest pusty</strong><br>
                    Dodaj produkty, aby rozpocząć zakupy.
                </div>
            </div>
        `;

    } else {

        cart.forEach(item => {

            const element =
                document.createElement("div");

            element.className = "cart-item";

            const itemTotal =
                item.price * item.quantity;

            element.innerHTML = `

                <div class="cart-top">

                    <div class="cart-name">
                        ${item.name}
                    </div>

                    <div class="cart-price">
                        ${formatPrice(itemTotal)}
                    </div>

                </div>

                <div class="cart-controls">

                    <button
                        class="quantity-button"
                        onclick="changeQuantity(${item.id}, -1)"
                    >
                        −
                    </button>

                    <div class="quantity">
                        ${item.quantity}
                    </div>

                    <button
                        class="quantity-button"
                        onclick="changeQuantity(${item.id}, 1)"
                    >
                        +
                    </button>

                    <button
                        class="remove"
                        onclick="removeFromCart(${item.id})"
                    >
                        Usuń
                    </button>

                </div>

            `;

            container.appendChild(element);

        });

    }

    updateSummary();
}


/* SUMMARY */

function updateSummary() {

    const count =
        cart.reduce(
            (sum, item) => sum + item.quantity,
            0
        );

    const total =
        cart.reduce(
            (sum, item) =>
                sum + item.price * item.quantity,
            0
        );

    document.getElementById("itemsCount")
        .textContent = count;

    document.getElementById("cartCount")
        .textContent =
        count === 1
            ? "1 produkt"
            : `${count} produktów`;

    document.getElementById("total")
        .textContent =
        formatPrice(total);

    document.getElementById("paymentTotal")
        .textContent =
        formatPrice(total);

    document.getElementById("payButton")
        .disabled = count === 0;
}


/* SEARCH / BARCODE */

document
    .getElementById("search")
    .addEventListener("input", function() {

        const value =
            this.value
                .trim()
                .toLowerCase();

        if (!value) {

            renderProducts(products);
            return;

        }

        const filtered =
            products.filter(product =>

                product.name
                    .toLowerCase()
                    .includes(value)

                ||

                product.barcode
                    .includes(value)

                ||

                product.category
                    .toLowerCase()
                    .includes(value)

            );

        renderProducts(filtered);

    });


document
    .getElementById("search")
    .addEventListener("keydown", function(event) {

        if (event.key !== "Enter") return;

        const code =
            this.value.trim();

        const product =
            products.find(
                p => p.barcode === code
            );

        if (product) {

            addToCart(product.id);

            this.value = "";

            renderProducts(products);

        }

    });


/* SCANNER */

function scanMode() {

    const input =
        document.getElementById("search");

    input.focus();

    input.value = "";

    input.placeholder =
        "Zeskanuj kod kreskowy...";

}


/* CLEAR */

function clearCart() {

    if (cart.length === 0) return;

    if (
        confirm(
            "Czy na pewno chcesz wyczyścić koszyk?"
        )
    ) {

        cart = [];

        renderCart();

    }

}


/* PAYMENT */

function openPayment() {

    if (cart.length === 0) return;

    document.getElementById(
        "paymentOverlay"
    ).style.display = "flex";

}


function closePayment() {

    document.getElementById(
        "paymentOverlay"
    ).style.display = "none";

}


function finishPayment(method) {

    const total =
        cart.reduce(
            (sum, item) =>
                sum + item.price * item.quantity,
            0
        );

    db.run(
        `
        INSERT INTO transakcje
        (data, suma)
        VALUES
        (datetime('now','localtime'), ?)
        `,
        [total]
    );

    saveDatabase();

    closePayment();

    alert(
        "Płatność zakończona.\n\n" +
        "Metoda: " + method + "\n" +
        "Kwota: " + formatPrice(total)
    );

    cart = [];

    renderCart();

}


/* HELP */

function showHelp() {

    alert(
        "POMOC\n\n" +
        "1. Wybierz produkt lub użyj wyszukiwarki.\n" +
        "2. Produkty możesz dodawać wielokrotnie.\n" +
        "3. Ilość zmienisz przyciskiem + / −.\n" +
        "4. Następnie wybierz „Przejdź do płatności”."
    );

}


/* SAVE DATABASE */

function saveDatabase() {

    if (!db) return;

    const data =
        db.export();

    let binary = "";

    data.forEach(byte => {
        binary += String.fromCharCode(byte);
    });

    localStorage.setItem(
        "kasaDB",
        btoa(binary)
    );

}


/* FORMAT */

function formatPrice(value) {

    return Number(value)
        .toFixed(2)
        .replace(".", ",") + " zł";

}


/* START */

initDatabase();

renderCart();

</script>

</body>
</html>
