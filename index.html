<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System kas samoobsługowych</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f4f5;
            color: #222;
        }

        header {
            height: 70px;
            background: #ffffff;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
        }

        .logo {
            font-size: 21px;
            font-weight: 700;
        }

        .logo span {
            color: #15803d;
        }

        .open-kasa {
            border: 0;
            background: #15803d;
            color: white;
            padding: 13px 22px;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
        }

        main {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            border: 1px solid #ddd;
            padding: 22px;
            border-radius: 6px;
        }

        .stat-title {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
        }

        .box {
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
        }

        .box-header {
            padding: 18px 20px;
            border-bottom: 1px solid #ddd;
            font-weight: 700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 14px 18px;
            border-bottom: 1px solid #eee;
        }

        th {
            font-size: 13px;
            color: #777;
            background: #fafafa;
        }

        td {
            font-size: 14px;
        }

        .price {
            font-weight: 700;
        }

        @media(max-width: 900px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }

            header {
                padding: 0 15px;
            }

            main {
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        Kasa <span>samoobsługowa</span>
    </div>

    <button class="open-kasa" onclick="location.href='kasa-so.html'">
        Otwórz kasę
    </button>
</header>

<main>

    <h1>Panel systemu</h1>
    <div class="subtitle">
        Dane produktów, kategorii i transakcji
    </div>

    <section class="stats">

        <div class="stat">
            <div class="stat-title">Produkty</div>
            <div class="stat-value" id="productsCount">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">Kategorie</div>
            <div class="stat-value" id="categoriesCount">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">Transakcje</div>
            <div class="stat-value" id="transactionsCount">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">Sprzedaż</div>
            <div class="stat-value" id="salesValue">0,00 zł</div>
        </div>

    </section>

    <section class="box">

        <div class="box-header">
            Lista produktów
        </div>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Produkt</th>
                    <th>Kategoria</th>
                    <th>Kod kreskowy</th>
                    <th>Cena</th>
                </tr>
            </thead>

            <tbody id="productsTable"></tbody>

        </table>

    </section>

</main>

<script>

let db;

async function initDatabase() {

    const SQL = await initSqlJs({
        locateFile: file =>
            `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/${file}`
    });

    const saved = localStorage.getItem("kasaDB");

    if (saved) {

        const bytes = Uint8Array.from(
            atob(saved),
            c => c.charCodeAt(0)
        );

        db = new SQL.Database(bytes);

    } else {

        const response = await fetch("baza.sql");
        const sql = await response.text();

        db = new SQL.Database();
        db.run(sql);
    }

    loadDashboard();
}

function loadDashboard() {

    const products =
        db.exec("SELECT COUNT(*) FROM produkty")[0].values[0][0];

    const categories =
        db.exec("SELECT COUNT(*) FROM kategorie")[0].values[0][0];

    const transactions =
        db.exec("SELECT COUNT(*) FROM transakcje")[0].values[0][0];

    const sales =
        db.exec("SELECT COALESCE(SUM(suma),0) FROM transakcje")[0].values[0][0];

    document.getElementById("productsCount").textContent = products;
    document.getElementById("categoriesCount").textContent = categories;
    document.getElementById("transactionsCount").textContent = transactions;

    document.getElementById("salesValue").textContent =
        Number(sales).toFixed(2).replace(".", ",") + " zł";

    const result = db.exec(`
        SELECT
            p.id,
            p.nazwa,
            k.nazwa,
            p.kod_kreskowy,
            p.cena
        FROM produkty p
        JOIN kategorie k
            ON k.id = p.kategoria_id
        ORDER BY p.id
    `);

    const tbody = document.getElementById("productsTable");

    tbody.innerHTML = "";

    if (!result.length) return;

    result[0].values.forEach(row => {

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${row[0]}</td>
            <td>${row[1]}</td>
            <td>${row[2]}</td>
            <td>${row[3]}</td>
            <td class="price">
                ${Number(row[4]).toFixed(2).replace(".", ",")} zł
            </td>
        `;

        tbody.appendChild(tr);
    });
}

initDatabase();

</script>

</body>
</html>
